<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Salary Slip V1.0.6</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      background: #f9f9f9;
    }
  </style>
</head>
<body>

  <h3>📄 Salary Slip</h3>

  <input type="text" id="empCode" placeholder="Staff ID"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>

  <button onclick="checkLogin()">Login</button>

  <div id="privateLink" style="margin-top:20px;"></div>

  <!-- ✅ overlay FIX แล้ว -->
  <div id="loadingOverlay" style="
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:rgba(0,0,0,0.5);
    color:white;
    font-size:20px;
    justify-content:center;
    align-items:center;
    z-index:9999;
  ">
    ⏳ Loading...
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxsbV1Blv1AMG_aBj6qnjNciYCt6HLD18cKG226i1ZLorv2afnZVQTBTXjangP535Q6XQ/exec";

    // ✅ JSONP (เวอร์ชันเสถียรจริง)
    function callAPI(url) {
      return new Promise((resolve, reject) => {

        const callbackName = "cb_" + Date.now() + "_" + Math.floor(Math.random()*1000);
        const script = document.createElement("script");

        // ✅ callback
        window[callbackName] = function(data) {
          console.log("✅ CALLBACK HIT", data);
          resolve(data);
          delete window[callbackName];
          script.remove();
        };

        // ❌ โหลด fail
        script.onerror = function() {
          console.error("❌ Script load error");
          reject("Load error");
          delete window[callbackName];
          script.remove();
        };

        // 🔥 กัน cache (สำคัญมาก)
        script.src = url 
          + (url.includes("?") ? "&" : "?")
          + "callback=" + callbackName
          + "&t=" + Date.now();

        document.body.appendChild(script);

        // ⛔ timeout กันค้าง
        setTimeout(() => {
          reject("Timeout");
          delete window[callbackName];
          script.remove();
        }, 8000);
      });
    }

    async function checkLogin() {
      const code = document.getElementById("empCode").value.trim();
      const pass = document.getElementById("password").value.trim();

      if (!code || !pass) {
        alert("⚠️ Please input data");
        return;
      }

      const overlay = document.getElementById("loadingOverlay");
      overlay.style.display = "flex";

      try {
        let url = API_URL +
          "?mode=private&staffId=" + encodeURIComponent(code) +
          "&pass=" + encodeURIComponent(pass);

        let data = await callAPI(url);

        if (data.privateImages && data.privateImages.length > 0) {
          let html = "";

          data.privateImages.forEach(item => {
            html += `
              <div style="margin-bottom:15px;">
                📅 ${item.month}<br>
                <a href="${item.url}" target="_blank">View Salary Slip</a>
              </div>
            `;
          });

          document.getElementById("privateLink").innerHTML = html;
        } else {
          document.getElementById("privateLink").innerHTML =
            "❌ Incorrect StaffID or Password";
        }

      } catch (err) {
        console.error("🔥 ERROR:", err);
        document.getElementById("privateLink").innerHTML =
          "⚠️ Fail (API error / timeout)";
      }

      overlay.style.display = "none";
    }
  </script>

</body>
</html>
